<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e3a6e">
<title>Toplim — Catálogo Virtual</title>
<style>
:root{--bg:#f4f6fb;--sf:#fff;--tx:#161a2b;--mt:#5b6480;--bd:#dde2ee;--pr:#2e3a6e;--ac:#0a96dc;--gr:#5aa84f;--dg:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131f;--sf:#1a1f31;--tx:#eef1fa;--mt:#9aa3bf;--bd:#2b3250;--pr:#8fa2ff;--ac:#3cb4f2;--gr:#7cc971;--dg:#ff7b6b}}
:root[data-theme="dark"]{--bg:#10131f;--sf:#1a1f31;--tx:#eef1fa;--mt:#9aa3bf;--bd:#2b3250;--pr:#8fa2ff;--ac:#3cb4f2;--gr:#7cc971;--dg:#ff7b6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sf);border-bottom:1px solid var(--bd);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px;color:var(--pr);letter-spacing:-.5px}.logo b{color:var(--ac)}
.grow{flex:1;min-width:160px}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;width:100%;min-height:42px}
button{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:9px 13px;cursor:pointer;min-height:42px}
button.p{background:var(--pr);border-color:var(--pr);color:#fff}[data-theme="dark"] button.p{color:#10131f}
button.d{color:var(--dg)}button.s{min-height:34px;padding:5px 10px;font-size:13px}
main{max-width:1200px;margin:0 auto;padding:12px 14px 40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.chips button{white-space:nowrap;border-radius:99px;min-height:36px;padding:6px 14px}
.chips button.on{background:var(--pr);color:#fff;border-color:var(--pr)}[data-theme="dark"] .chips button.on{color:#10131f}
.bar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.cnt{color:var(--mt);margin:6px 0 10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.list .grid{grid-template-columns:1fr}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px}
.card h3{margin:0;font-size:14.5px;line-height:1.3}
.tag{display:inline-block;font-size:11.5px;border-radius:99px;padding:2px 9px;background:var(--bg);border:1px solid var(--bd);color:var(--mt)}
.cod{font-size:12px;color:var(--ac);font-weight:700}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(30px + env(safe-area-inset-bottom,0px))}
.sheet .in{max-width:1000px;margin:0 auto}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0;border-bottom:1px solid var(--bd);padding-bottom:8px}
.tabs button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.pn{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.pn h2{margin:0 0 10px;font-size:17px}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;margin-bottom:8px}
label{font-size:12.5px;color:var(--mt);display:block;margin-bottom:3px}
.it{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.it div:first-child{min-width:0;flex:1}.it small{color:var(--mt)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pr);color:#fff;padding:10px 16px;border-radius:99px;z-index:50;max-width:90%}
.ok{color:var(--gr)}.mt{color:var(--mt)}
@media print{header,.chips,.bar,.more,.noprint{display:none!important}.card{break-inside:avoid}}
</style>
</head>
<body>
<header>
 <div class="logo">top<b>lim</b></div>
 <div class="grow"><input id="q" type="search" placeholder="Buscar por nome, código ou marca…" aria-label="Buscar"></div>
 <select id="cs" style="width:auto;max-width:190px" aria-label="Catálogo"></select>
 <button id="th" title="Tema" aria-label="Alternar tema">◐</button>
 <button id="ad" class="p">Administrador</button>
</header>
<main>
 <div class="chips" id="chips"></div>
 <div class="bar">
  <select id="sub" aria-label="Subcategoria"></select>
  <select id="so" aria-label="Ordenar"><option value="n">Ordem: nome A–Z</option><option value="c">Ordem: código</option><option value="m">Ordem: marca</option></select>
  <select id="vw" aria-label="Visualização"><option value="g">Visual em grade</option><option value="l">Visual em lista</option></select>
 </div>
 <div class="cnt" id="cnt"></div>
 <div id="out"></div>
 <div style="text-align:center;margin-top:14px" class="more"><button id="mo" class="s" hidden>Mostrar mais</button></div>
</main>
<div id="adm" class="sheet" hidden></div>

const CATS_ORIG=["Alimentos e Bebidas","Automotivo","Descartáveis e Embalagens","Higiene Pessoal","Limpeza e Higienização","Outros Produtos","Utensílios e Equipamentos"];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const KEY="toplim_catalogo_v1";let mem=null;
function mk(prods,name){const c={};CATS_ORIG.forEach(k=>c[k]=[]);prods.forEach(p=>{c[p.cat]=c[p.cat]||[];if(p.sub&&!c[p.cat].includes(p.sub))c[p.cat].push(p.sub)});return{n:name,p:prods.map(p=>({...p})),c}}
let DB;
function load(){try{const r=localStorage.getItem(KEY);if(r)DB=JSON.parse(r)}catch(e){}
 if(!DB){DB=mem||{cur:"a",pin:"1234",l:{a:mk(ORIG,"Catálogo Toplim (original)")}}}}
function save(){mem=DB;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
const C=()=>DB.l[DB.cur];
let S={q:"",cat:"",sub:"",so:"n",vw:"g",n:60,admin:false,tab:"p",aq:"",edit:null,an:40};
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function norm(s){return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()}
function filt(q,cat,sub){const k=norm(q).split(/\s+/).filter(Boolean);return C().p.filter(p=>(!cat||p.cat===cat)&&(!sub||p.sub===sub)&&k.every(w=>norm(p.cod+" "+p.nome+" "+p.marca+" "+p.sub).includes(w)))}
function sorted(a,so){const f=so==="c"?(x,y)=>String(x.cod).localeCompare(String(y.cod),"pt",{numeric:true}):so==="m"?(x,y)=>x.marca.localeCompare(y.marca,"pt")||x.nome.localeCompare(y.nome,"pt"):(x,y)=>x.nome.localeCompare(y.nome,"pt");return a.slice().sort(f)}
function renderTop(){
 const cs=$("#cs");cs.innerHTML=Object.entries(DB.l).map(([i,c])=>`<option value="${i}" ${i===DB.cur?"selected":""}>${esc(c.n)}</option>`).join("");
 const cats=Object.keys(C().c);if(S.cat&&!cats.includes(S.cat))S.cat="";
 $("#chips").innerHTML=`<button class="${S.cat?"":"on"}" data-c="">Todas (${C().p.length})</button>`+cats.map(c=>`<button class="${S.cat===c?"on":""}" data-c="${esc(c)}">${esc(c)} (${C().p.filter(p=>p.cat===c).length})</button>`).join("");
 const subs=S.cat?C().c[S.cat]||[]:[...new Set(Object.values(C().c).flat())].sort((a,b)=>a.localeCompare(b,"pt"));
 if(S.sub&&!subs.includes(S.sub))S.sub="";
 $("#sub").innerHTML=`<option value="">Todas as subcategorias</option>`+subs.map(s=>`<option ${s===S.sub?"selected":""}>${esc(s)}</option>`).join("");
 renderList()}
function renderList(){
 const r=sorted(filt(S.q,S.cat,S.sub),S.so),sh=r.slice(0,S.n);
 $("#cnt").textContent=`${r.length} produto(s) encontrado(s)`;
 $("#out").className=S.vw==="l"?"list":"";
 $("#out").innerHTML=r.length?`<div class="grid">${sh.map(p=>`<div class="card"><div class="cod">Cód. ${esc(p.cod)}</div><h3>${esc(p.nome)}</h3><div class="row"><span class="tag">${esc(p.cat)}</span><span class="tag">${esc(p.sub)}</span>${p.marca?`<span class="tag">${esc(p.marca)}</span>`:""}</div></div>`).join("")}</div>`:`<p class="mt">Nenhum produto encontrado.</p>`;
 $("#mo").hidden=r.length<=S.n}
$("#q").oninput=e=>{S.q=e.target.value;S.n=60;renderList()};
$("#chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;S.cat=b.dataset.c;S.sub="";S.n=60;renderTop()};
$("#sub").onchange=e=>{S.sub=e.target.value;S.n=60;renderList()};
$("#so").onchange=e=>{S.so=e.target.value;renderList()};
$("#vw").onchange=e=>{S.vw=e.target.value;renderList()};
$("#mo").onclick=()=>{S.n+=100;renderList()};
$("#cs").onchange=e=>{DB.cur=e.target.value;save();S.cat=S.sub="";renderTop()};
$("#th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
/* ADMIN */
$("#ad").onclick=()=>{if(S.admin){openAdm();return}
 const p=prompt("Senha de administrador (padrão inicial: 1234):");if(p===null)return;
 if(p===DB.pin){S.admin=true;openAdm()}else toast("Senha incorreta")};
function openAdm(){$("#adm").hidden=false;document.body.style.overflow="hidden";rAdm()}
function closeAdm(){$("#adm").hidden=true;document.body.style.overflow="";renderTop()}
function catOpts(sel){return Object.keys(C().c).map(c=>`<option ${c===sel?"selected":""}>${esc(c)}</option>`).join("")}
function subOpts(cat,sel){return (C().c[cat]||[]).map(s=>`<option ${s===sel?"selected":""}>${esc(s)}</option>`).join("")}
const TABS=[["p","Produtos"],["c","Categorias"],["k","Catálogos"],["i","Importar / Exportar"],["s","Segurança"]];
function rAdm(){
 const T=TABS.map(([k,n])=>`<button class="${S.tab===k?"on":""}" data-t="${k}">${n}</button>`).join("");
 let b="";
 if(S.tab==="p")b=tabP();else if(S.tab==="c")b=tabC();else if(S.tab==="k")b=tabK();else if(S.tab==="i")b=tabI();else b=tabS();
 $("#adm").innerHTML=`<div class="in"><div class="row" style="justify-content:space-between"><div><b>Painel do administrador</b><div class="mt" style="font-size:13px">Catálogo ativo: ${esc(C().n)} · ${C().p.length} produtos</div></div><div class="row"><button id="lo" class="s">Sair do modo admin</button><button id="cl" class="p">Fechar</button></div></div><div class="tabs">${T}</div>${b}</div>`;
 $("#cl").onclick=closeAdm;$("#lo").onclick=()=>{S.admin=false;closeAdm()};
 $(".tabs").onclick=e=>{const b=e.target.closest("button");if(b){S.tab=b.dataset.t;rAdm()}};
 bind()}
function tabP(){const e=S.edit!==null?C().p.find(p=>p.cod===S.edit):null;const cat=e?e.cat:Object.keys(C().c)[0];
 const a=filt(S.aq,"","").slice(0,S.an);
 return `<div class="pn"><h2>${e?"Editar produto":"Adicionar produto"}</h2><div class="f">
 <div><label>Código</label><input id="fc" value="${esc(e?e.cod:"")}" ${e?"readonly":""}></div>

 <div><label>Categoria</label><select id="fk">${catOpts(cat)}</select></div>
 <div><label>Subcategoria</label><select id="fs">${subOpts(cat,e&&e.sub)}</select></div>
 <div><label>Marca</label><input id="fm" value="${esc(e?e.marca:"")}"></div></div>
 <div class="row"><button class="p" id="fsv">${e?"Salvar alterações":"Adicionar produto"}</button>${e?`<button id="fcn">Cancelar</button>`:""}</div></div>
 <div class="pn"><h2>Produtos do catálogo</h2><input id="aq" type="search" placeholder="Buscar para editar ou excluir…" value="${esc(S.aq)}"><div style="margin-top:8px">${a.map(p=>`<div class="it"><div><b>${esc(p.nome)}</b><br><small>Cód. ${esc(p.cod)} · ${esc(p.cat)} › ${esc(p.sub)}</small></div><div class="row"><button class="s" data-e="${esc(p.cod)}">Editar</button><button class="s d" data-x="${esc(p.cod)}">Excluir</button></div></div>`).join("")||"<p class='mt'>Nada encontrado.</p>"}</div>${filt(S.aq,"","").length>S.an?`<button class="s" id="am" style="margin-top:8px">Mostrar mais</button>`:""}</div>`}
function tabC(){return `<div class="pn"><h2>Nova categoria</h2><div class="row"><input id="nc" placeholder="Nome da categoria" style="flex:1"><button class="p" id="ncb">Adicionar</button></div></div>`+
 Object.entries(C().c).map(([c,ss])=>{const n=C().p.filter(p=>p.cat===c).length;return `<div class="pn"><div class="row" style="justify-content:space-between"><h2 style="margin:0">${esc(c)} <span class="mt" style="font-size:13px;font-weight:400">(${n})</span></h2><div class="row"><button class="s" data-rc="${esc(c)}">Renomear</button><button class="s d" data-dc="${esc(c)}">Excluir</button></div></div>
 ${ss.map(s=>`<div class="it"><div>${esc(s)} <small>(${C().p.filter(p=>p.cat===c&&p.sub===s).length})</small></div><div class="row"><button class="s" data-rs="${esc(c)}|${esc(s)}">Renomear</button><button class="s d" data-ds="${esc(c)}|${esc(s)}">Excluir</button></div></div>`).join("")}

function tabK(){return `<div class="pn"><h2>Seus catálogos</h2>${Object.entries(DB.l).map(([i,c])=>`<div class="it"><div><b>${esc(c.n)}</b> ${i===DB.cur?'<span class="ok">● ativo</span>':""}<br><small>${c.p.length} produtos · ${Object.keys(c.c).length} categorias</small></div><div class="row"><button class="s" data-u="${i}">Usar</button><button class="s" data-rn="${i}">Renomear</button><button class="s" data-dp="${i}">Duplicar</button><button class="s d" data-dl="${i}">Excluir</button></div></div>`).join("")}</div>
 <div class="pn"><h2>Criar novo catálogo</h2><div class="f"><div><label>Nome</label><input id="kn" placeholder="Ex.: Catálogo Restaurantes"></div><div><label>Começar com</label><select id="ko"><option value="v">Catálogo vazio</option><option value="a">Cópia do catálogo ativo</option><option value="o">Cópia do original do PDF (801 produtos)</option></select></div></div><button class="p" id="kc">Criar catálogo</button></div>
 <div class="pn"><h2>Recriar catálogo ativo</h2><p class="mt" style="margin-top:0">Substitui todo o conteúdo do catálogo ativo pelo original extraído do PDF (801 produtos). Alterações feitas serão perdidas.</p><button class="d" id="kr">Recriar a partir do original</button></div>`}
function tabI(){return `<div class="pn"><h2>Exportar (transferir) catálogo ativo</h2><div class="row"><button class="p" id="xj">Arquivo JSON (backup completo)</button><button id="xc">Planilha CSV (Excel)</button><button id="xp">Imprimir / salvar em PDF</button></div></div>
 <div class="pn"><h2>Importar arquivo</h2><div class="f"><div><label>Modo</label><select id="im"><option value="n">Criar como novo catálogo</option><option value="m">Mesclar no catálogo ativo (por código)</option><option value="s">Substituir catálogo ativo</option></select></div><div><label>Arquivo (.json ou .csv)</label><input id="if" type="file" accept=".json,.csv,.txt"></div></div>
 <p class="mt" style="margin:0;font-size:13px">CSV com colunas: código; produto; categoria; subcategoria; marca (separador ; ou ,). Categorias novas são criadas automaticamente.</p></div>`}
function tabS(){return `<div class="pn"><h2>Alterar senha de administrador</h2><div class="f"><div><label>Nova senha (mín. 4 caracteres)</label><input id="np" type="password"></div></div><button class="p" id="npb">Salvar senha</button><p class="mt" style="font-size:13px">A senha protege o painel neste aparelho. Os dados ficam salvos no próprio navegador/aparelho: exporte um backup JSON com frequência.</p></div>`}
function bind(){const A=$("#adm"),g=s=>A.querySelector(s),ga=s=>A.querySelectorAll(s);
 const fk=g("#fk");if(fk)fk.onchange=()=>{g("#fs").innerHTML=subOpts(fk.value)};
 const aq=g("#aq");if(aq)aq.oninput=e=>{S.aq=e.target.value;S.an=40;const p=e.target.selectionStart;rAdm();const n=$("#aq");n.focus();n.setSelectionRange(p,p)};
 if(g("#am"))g("#am").onclick=()=>{S.an+=60;rAdm()};
 if(g("#fcn"))g("#fcn").onclick=()=>{S.edit=null;rAdm()};
 if(g("#fsv"))g("#fsv").onclick=()=>{const o={cod:g("#fc").value.trim(),nome:g("#fn").value.trim().toUpperCase(),cat:g("#fk").value,sub:g("#fs").value,marca:g("#fm").value.trim()};
  if(!o.cod||!o.nome)return toast("Informe código e nome");
  if(S.edit!==null){Object.assign(C().p.find(p=>p.cod===S.edit),o);S.edit=null;toast("Produto atualizado")}
  else{if(C().p.some(p=>p.cod===o.cod))return toast("Código já existe");C().p.unshift(o);toast("Produto adicionado")}
  save();rAdm()};
 ga("[data-e]").forEach(b=>b.onclick=()=>{S.edit=b.dataset.e;rAdm();scrollTo(0,0);$("#adm").scrollTop=0});
 ga("[data-x]").forEach(b=>b.onclick=()=>{if(confirm("Excluir este produto?")){C().p=C().p.filter(p=>p.cod!==b.dataset.x);save();rAdm()}});
 if(g("#ncb"))g("#ncb").onclick=()=>{const n=g("#nc").value.trim();if(!n)return;if(C().c[n])return toast("Categoria já existe");C().c[n]=[];save();rAdm()};
 ga("[data-nsb]").forEach(b=>b.onclick=()=>{const c=b.dataset.nsb,i=g(`[data-ns="${CSS.escape(c)}"]`),n=i.value.trim();if(!n)return;if(C().c[c].includes(n))return toast("Já existe");C().c[c].push(n);save();rAdm()});
 ga("[data-rc]").forEach(b=>b.onclick=()=>{const o=b.dataset.rc,n=(prompt("Novo nome da categoria:",o)||"").trim();if(!n||n===o)return;if(C().c[n])return toast("Nome já usado");const c={};Object.keys(C().c).forEach(k=>c[k===o?n:k]=C().c[k]);C().c=c;C().p.forEach(p=>{if(p.cat===o)p.cat=n});save();rAdm()});
 ga("[data-dc]").forEach(b=>b.onclick=()=>{const o=b.dataset.dc;if(C().p.some(p=>p.cat===o))return toast("Mova ou exclua os produtos desta categoria antes");if(confirm("Excluir categoria?")){delete C().c[o];save();rAdm()}});
 ga("[data-rs]").forEach(b=>b.onclick=()=>{const[c,o]=b.dataset.rs.split("|"),n=(prompt("Novo nome da subcategoria:",o)||"").trim();if(!n||n===o)return;C().c[c]=C().c[c].map(s=>s===o?n:s);C().p.forEach(p=>{if(p.cat===c&&p.sub===o)p.sub=n});save();rAdm()});
 ga("[data-ds]").forEach(b=>b.onclick=()=>{const[c,o]=b.dataset.ds.split("|");if(C().p.some(p=>p.cat===c&&p.sub===o))return toast("Mova ou exclua os produtos desta subcategoria antes");C().c[c]=C().c[c].filter(s=>s!==o);save();rAdm()});
 ga("[data-u]").forEach(b=>b.onclick=()=>{DB.cur=b.dataset.u;S.cat=S.sub="";save();rAdm()});
 ga("[data-rn]").forEach(b=>b.onclick=()=>{const n=(prompt("Novo nome:",DB.l[b.dataset.rn].n)||"").trim();if(n){DB.l[b.dataset.rn].n=n;save();rAdm()}});
 ga("[data-dp]").forEach(b=>b.onclick=()=>{addCat(JSON.parse(JSON.stringify(DB.l[b.dataset.dp])),DB.l[b.dataset.dp].n+" (cópia)");rAdm()});
 ga("[data-dl]").forEach(b=>b.onclick=()=>{if(Object.keys(DB.l).length<2)return toast("Mantenha ao menos um catálogo");if(confirm("Excluir este catálogo?")){const i=b.dataset.dl;delete DB.l[i];if(DB.cur===i)DB.cur=Object.keys(DB.l)[0];save();rAdm()}});
 if(g("#kc"))g("#kc").onclick=()=>{const n=g("#kn").value.trim();if(!n)return toast("Informe o nome");const o=g("#ko").value;addCat(o==="v"?{p:[],c:{}}:o==="a"?JSON.parse(JSON.stringify(C())):mk(ORIG),n,true);rAdm()};
 if(g("#kr"))g("#kr").onclick=()=>{if(confirm("Recriar o catálogo ativo a partir do original? As alterações serão perdidas.")){const n=C().n;DB.l[DB.cur]=mk(ORIG,n);save();toast("Catálogo recriado");rAdm()}};
 if(g("#xj"))g("#xj").onclick=()=>dl("catalogo-toplim.json",JSON.stringify({catalogo:C().n,p:C().p,c:C().c},null,1),"application/json");
 if(g("#xc"))g("#xc").onclick=()=>dl("catalogo-toplim.csv","\ufeff"+["codigo","produto","categoria","subcategoria","marca"].join(";")+"\n"+C().p.map(p=>[p.cod,p.nome,p.cat,p.sub,p.marca].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n"),"text/csv");
 if(g("#xp"))g("#xp").onclick=()=>{closeAdm();S.cat=S.sub="";S.q="";$("#q").value="";S.n=99999;renderTop();setTimeout(()=>print(),300)};
 if(g("#if"))g("#if").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(f.name,String(r.result),g("#im").value);r.readAsText(f)};
 if(g("#npb"))g("#npb").onclick=()=>{const v=g("#np").value;if(v.length<4)return toast("Senha muito curta");DB.pin=v;save();toast("Senha alterada")}}
function addCat(c,n,go){const id="k"+Date.now();c.n=n;DB.l[id]=c;if(go)DB.cur=id;save();toast("Catálogo criado")}
async function dl(name,text,type){let d=null;try{d=await claude.use("downloads")}catch(e){}
 if(d){try{await d.save({filename:name,data:new Blob([text],{type})});return}catch(e){if(e&&e.code==="declined")return}}
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click()}catch(e){toast("Não foi possível salvar o arquivo neste ambiente")}}
function csv(t){t=t.replace(/^\ufeff/,"");const d=(t.split("\n")[0].match(/;/g)||[]).length>=(t.split("\n")[0].match(/,/g)||[]).length?";":",";const rows=[];let r=[],f="",q=false;
 for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===d){r.push(f);f=""}else if(ch==="\n"){r.push(f.replace(/\r$/,""));rows.push(r);r=[];f=""}else f+=ch}
 if(f||r.length){r.push(f.replace(/\r$/,""));rows.push(r)}return rows.filter(x=>x.some(v=>v.trim()))}
function imp(name,txt,mode){let ps=[],ex=null;
 try{if(/\.json$/i.test(name)){const j=JSON.parse(txt);ps=j.p||j;ex=j.c||null;if(j.catalogo&&mode==="n")name=j.catalogo}
  else{let rs=csv(txt);if(/c[oó]d/i.test(rs[0][0]))rs.shift();ps=rs.map(r=>({cod:(r[0]||"").trim(),nome:(r[1]||"").trim(),cat:(r[2]||"").trim()||"Outros Produtos",sub:(r[3]||"").trim()||"Diversos",marca:(r[4]||"").trim()}))}
 }catch(e){return toast("Arquivo inválido")}
 ps=ps.filter(p=>p&&p.cod&&p.nome).map(p=>({cod:String(p.cod),nome:String(p.nome),cat:p.cat||"Outros Produtos",sub:p.sub||"Diversos",marca:p.marca||""}));
 if(!ps.length)return toast("Nenhum produto válido no arquivo");
 const build=(base)=>{ps.forEach(p=>{base.c[p.cat]=base.c[p.cat]||[];if(!base.c[p.cat].includes(p.sub))base.c[p.cat].push(p.sub)});if(ex)Object.entries(ex).forEach(([k,v])=>{base.c[k]=base.c[k]||[];v.forEach(s=>{if(!base.c[k].includes(s))base.c[k].push(s)})});return base};
 if(mode==="n"){const b=build({p:ps,c:{}});addCat(b,name.replace(/\.\w+$/,"")||"Importado",true)}
 else if(mode==="s"){if(!confirm("Substituir todo o catálogo ativo?"))return;const b=build({p:ps,c:{}});b.n=C().n;DB.l[DB.cur]=b;save()}
 else{const m=new Map(C().p.map(p=>[p.cod,p]));ps.forEach(p=>m.set(p.cod,p));C().p=[...m.values()];build(C());save()}
 toast(ps.length+" produto(s) importado(s)");rAdm()}
load();renderTop();
</script>
</body>
